name: quicktask-auth

# Mismo namespace que quicktask: los Secrets con las claves se crean allí.
namespace: quicktask

chart:
  repoURL: https://github.com/slashispy/helm-chart-generic-app
  path: .
  targetRevision: main

enabled: true
